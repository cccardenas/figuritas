services:
  mysql:
    image: mysql:8.4
    container_name: figuritas_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: figuritas_root
      MYSQL_DATABASE: figuritas_2026
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
